<!-- templates/components/crud_modal.html -->
<div id="crud-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="modal-box w-full max-w-md max-h-[85vh] overflow-y-auto shadow-2xl">
        <h2 id="modal-title" class="text-xl font-bold mb-5">Adicionar Item</h2>
        <form id="crud-form" method="POST">
            <input type="hidden" name="item_id" id="item-id">
            <input type="hidden" name="next_occurrences" id="next-occurrences" value="false">

            {% for field in crud_schema %}
                <div class="form-control mb-4">
                    <label class="label pb-1" for="{{ field.name }}">
                        <span class="label-text font-medium">{{ field.label }}</span>
                    </label>
                    {% if field.type == "combobox" %}
                        <select name="{{ field.name }}" id="{{ field.name }}" class="select select-bordered">
                            {% for option in field.options %}
                                <option value="{{ option.value }}">{{ option.label }}</option>
                            {% endfor %}
                        </select>

                    {% elif field.type == "switch" %}
                        <div class="flex items-center gap-3 mt-1">
                            <input type="switch" name="{{ field.name }}" id="{{ field.name }}" class="hidden">
                            <div class="relative w-11 h-6 bg-base-300 rounded-full cursor-pointer transition-colors duration-200" onclick="toggleSwitch('{{ field.name }}')">
                                <div id="{{ field.name }}-toggle" class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow transition-transform duration-200"></div>
                            </div>
                        </div>
                    {% elif field.type == "icons" %}
                        <div class="relative">
                            <input type="text" name="{{ field.name }}" id="{{ field.name }}" class="hidden">
                            <div class="flex items-center gap-3 cursor-pointer p-2 border border-base-300 rounded-lg hover:bg-base-200 transition" onclick="toggleIconDropdown('{{ field.name }}')">
                                <i id="selected-icon-{{ field.name }}" class="fas fa-question-circle text-2xl text-base-content/50"></i>
                                <span class="text-base-content/70 text-sm">Escolha um ícone</span>
                            </div>
                            <div id="icon-dropdown-{{ field.name }}" class="hidden absolute z-10 bg-base-100 border border-base-300 rounded-box shadow-xl p-3 w-64 max-h-64 overflow-auto mt-1">
                                <input type="text" id="icon-search-{{ field.name }}" class="input input-bordered input-sm w-full mb-2" placeholder="Buscar ícone...">
                                <div id="icon-list-{{ field.name }}" class="grid grid-cols-6 gap-1"></div>
                            </div>
                        </div>
                    {% else %}
                        <input type="{{ field.type }}" name="{{ field.name }}" id="{{ field.name }}"
                               step="{{ field.step }}" min="{{ field.min }}" max="{{ field.max }}"
                               class="input input-bordered"
                               {% if field.required %}required{% endif %}>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="modal-action mt-6">
                <button type="button" id="save-btn" class="btn btn-primary">
                    <i class="fas fa-save"></i> Salvar
                </button>
                {% if permissions.delete %}
                    <button type="button" id="delete-btn" class="btn btn-error">
                        <i class="fas fa-trash"></i> Excluir
                    </button>
                {% endif %}
                <button type="button" id="cancel-btn" class="btn btn-ghost">Cancelar</button>
            </div>
        </form>
    </div>
</div>


<style>
.relative.w-11.active {
    background-color: oklch(var(--su));
}
.absolute.move {
    transform: translateX(125%);
}
</style>

<script>
function toggleIconDropdown(fieldName) {
    document.getElementById(`icon-dropdown-${fieldName}`).classList.toggle("hidden");
}

function loadIcons(fieldName) {
    const iconContainer = document.getElementById(`icon-list-${fieldName}`);
    const searchInput = document.getElementById(`icon-search-${fieldName}`);

    if (!iconContainer) return;
    iconContainer.innerHTML = "";

    const icons = [
    "fas fa-wallet", "fas fa-coins", "fas fa-money-bill-wave", "fas fa-money-bill",
    "fas fa-money-check", "fas fa-money-check-alt", "fas fa-cash-register",
    "fas fa-hand-holding-usd", "fas fa-university", "fas fa-landmark", "fas fa-building",
    "fas fa-credit-card", "fas fa-id-card", "fas fa-hand-holding-dollar", "fas fa-receipt",
    "fas fa-piggy-bank", "fas fa-safe", "fas fa-file-invoice-dollar", "fas fa-calculator",
    "fas fa-chart-line", "fas fa-chart-pie", "fas fa-chart-bar", "fas fa-chart-area",
    "fas fa-arrow-trend-up", "fas fa-arrow-trend-down", "fas fa-balance-scale",
    "fas fa-percentage", "fas fa-business-time", "fas fa-home", "fas fa-lightbulb",
    "fas fa-water", "fas fa-bolt", "fas fa-fire", "fas fa-wrench", "fas fa-toolbox",
    "fas fa-hammer", "fas fa-soap", "fas fa-door-open", "fas fa-bed", "fas fa-couch",
    "fas fa-broom", "fas fa-car", "fas fa-gas-pump", "fas fa-taxi", "fas fa-bus",
    "fas fa-motorcycle", "fas fa-plane", "fas fa-train", "fas fa-shipping-fast",
    "fas fa-road", "fas fa-car-battery", "fas fa-truck-pickup", "fas fa-shopping-cart",
    "fas fa-shopping-bag", "fas fa-store", "fas fa-gift", "fas fa-box", "fas fa-truck",
    "fas fa-tags", "fas fa-barcode", "fas fa-utensils", "fas fa-wine-glass",
    "fas fa-coffee", "fas fa-hamburger", "fas fa-pizza-slice", "fas fa-ice-cream",
    "fas fa-cookie", "fas fa-carrot", "fas fa-apple-alt", "fas fa-mug-hot",
    "fas fa-hospital", "fas fa-heartbeat", "fas fa-pills", "fas fa-first-aid",
    "fas fa-stethoscope", "fas fa-tooth", "fas fa-syringe", "fas fa-graduation-cap",
    "fas fa-book", "fas fa-school", "fas fa-chalkboard-teacher", "fas fa-pencil-alt",
    "fas fa-laptop", "fas fa-microscope", "fas fa-atom", "fas fa-flask",
    "fas fa-mobile-alt", "fas fa-tablet-alt", "fas fa-headset", "fas fa-wifi",
    "fas fa-microchip", "fas fa-globe", "fas fa-server", "fas fa-film", "fas fa-tv",
    "fas fa-gamepad", "fas fa-ticket-alt", "fas fa-music", "fas fa-headphones",
    "fas fa-dice", "fas fa-chess", "fas fa-camera-retro", "fas fa-tshirt",
    "fas fa-shoe-prints", "fas fa-glasses", "fas fa-ring", "fas fa-gem", "fas fa-paw",
    "fas fa-dog", "fas fa-cat", "fas fa-bone", "fas fa-fish", "fas fa-seedling",
    "fas fa-passport", "fas fa-suitcase", "fas fa-compass", "fas fa-umbrella-beach",
    "fas fa-briefcase", "fas fa-users", "fas fa-handshake", "fas fa-calendar-check",
    "fas fa-hands-helping", "fas fa-hand-holding-heart", "fas fa-donate", "fas fa-heart",
    ];

    icons.forEach(iconClass => {
        const iconElement = document.createElement("i");
        iconElement.className = `${iconClass} text-xl cursor-pointer p-2 hover:bg-base-200 rounded transition`;
        iconElement.onclick = () => selectIcon(fieldName, iconClass);
        iconContainer.appendChild(iconElement);
    });

    searchInput.addEventListener("input", function () {
        const searchValue = this.value.toLowerCase();
        Array.from(iconContainer.getElementsByTagName("i")).forEach(icon => {
            icon.style.display = icon.className.includes(searchValue) ? "inline-block" : "none";
        });
    });
}

function selectIcon(fieldName, iconClass) {
    document.getElementById(`selected-icon-${fieldName}`).className = `${iconClass} text-2xl`;
    document.getElementById(fieldName).value = iconClass;
    document.getElementById(`icon-dropdown-${fieldName}`).classList.add("hidden");
}

function setColorIcon(fieldName, color) {
    document.getElementById(`selected-icon-${fieldName}`).style.color = color;
}

window.toggleIconDropdown = toggleIconDropdown;
window.loadIcons = loadIcons;
window.selectIcon = selectIcon;
window.setColorIcon = setColorIcon;

async function openModal(mode, id = null, url_redirect = null) {
    const modal = document.getElementById("crud-modal");
    const form = document.getElementById("crud-form");
    const title = document.getElementById("modal-title");
    const saveBtn = document.getElementById("save-btn");
    const deleteBtn = document.getElementById("delete-btn");
    const cancelBtn = document.getElementById("cancel-btn");

    cancelBtn.onclick = () => {
        document.getElementById("crud-modal").classList.add("hidden");
    };

    if (url_redirect) {
        const urlInput = document.createElement("input");
        urlInput.type = "hidden";
        urlInput.name = "url_redirect";
        urlInput.value = url_redirect;
        form.appendChild(urlInput);
    }

    saveBtn.onclick = async () => {
        const isRecurring = document.getElementById("is_recurring")?.checked;
        const isInstallment = document.getElementById("is_installment")?.checked;

        if (isRecurring || isInstallment) {
            const result = await Swal.fire({
                title: "Alterar recorrência?",
                text: "Deseja aplicar esta alteração apenas nesta ocorrência ou também nas próximas?",
                icon: "question",
                showDenyButton: true,
                showCancelButton: true,
                confirmButtonText: "Somente esta",
                denyButtonText: "Próximas também",
                cancelButtonText: "Cancelar"
            });
            if (result.isConfirmed) {
                document.getElementById("next-occurrences").value = "false";
                form.submit();
            } else if (result.isDenied) {
                document.getElementById("next-occurrences").value = "true";
                form.submit();
            }
        } else {
            form.submit();
        }
    };

    if (deleteBtn) {
        deleteBtn.onclick = async () => {
            form.action = `/${entity}/${id}/delete`;
            const isRecurring = document.getElementById("is_recurring")?.checked;
            const isInstallment = document.getElementById("is_installment")?.checked;

            if (isRecurring || isInstallment) {
                const result = await Swal.fire({
                    title: "Deletar recorrência?",
                    text: "Deseja deletar apenas esta ocorrência ou também as próximas?",
                    icon: "question",
                    showDenyButton: true,
                    showCancelButton: true,
                    confirmButtonText: "Somente esta",
                    denyButtonText: "Próximas também",
                    cancelButtonText: "Cancelar"
                });
                if (result.isConfirmed) {
                    document.getElementById("next-occurrences").value = "false";
                    form.submit();
                } else if (result.isDenied) {
                    document.getElementById("next-occurrences").value = "true";
                    form.submit();
                }
            } else {
                const result = await Swal.fire({
                    title: "Deletar?",
                    text: "Certeza que deseja deletar?",
                    icon: "question",
                    showDenyButton: true,
                    showCancelButton: true,
                    confirmButtonText: "Sim",
                    denyButtonText: "Não",
                    cancelButtonText: "Cancelar"
                });
                if (result.isConfirmed) {
                    form.submit();
                }
            }
        };
    }

    const entity = "{{ entity }}";
    if (mode === 'add') {
        title.innerText = "Adicionar Item";
        form.action = `/${entity}`;
        form.reset();
        document.getElementById("item-id").value = "";
        saveBtn.classList.remove("hidden");
        modal.classList.remove("hidden");
        loadIcons("icon");
    } else if (mode === 'edit') {
        title.innerText = "Editar Item";
        form.action = `/${entity}/${id}/edit`;
        document.getElementById("item-id").value = id;
        try {
            await loadEntity(id);
            modal.classList.remove("hidden");
        } catch (error) {
            console.error("Erro ao carregar os dados:", error);
            alert("Erro ao carregar os dados para edição.");
        }
        saveBtn.classList.remove("hidden");
        loadIcons("icon");
    } else if (mode === 'delete') {
        await loadEntity(id);
        if (deleteBtn) deleteBtn.click();
    }
}

async function loadEntity(id) {
    const response = await fetch(`/{{ entity }}/${id}`);
    if (!response.ok) throw new Error(`Erro ao buscar os dados: ${response.statusText}`);
    const data = await response.json();

    {% for field in crud_schema %}
        if (data["{{ field.name }}"] !== undefined) {
            if ("{{ field.type }}" === "switch") {
                const checkbox = document.getElementById("{{ field.name }}");
                checkbox.checked = data["{{ field.name }}"];
                checkbox.value = data["{{ field.name }}"];
                toggleSwitchUI("{{ field.name }}", data["{{ field.name }}"]);
            } else if ("{{ field.type }}" === "combobox") {
                const select = document.getElementById("{{ field.name }}");
                let optionExists = Array.from(select.options).some(opt => opt.value == data["{{ field.name }}"]);
                if (optionExists) {
                    select.value = data["{{ field.name }}"];
                }
            } else if ("{{ field.type }}" === "icons") {
                selectIcon("{{ field.name }}", data["{{ field.name }}"]);
                setColorIcon("{{ field.name }}", data["color"]);
            } else {
                document.getElementById("{{ field.name }}").value = data["{{ field.name }}"];
            }
        }
    {% endfor %}
    return data;
}

document.getElementById("color")?.addEventListener("input", function () {
    setColorIcon("icon", this.value);
});

function toggleSwitch(name) {
    const checkbox = document.getElementById(name);
    checkbox.checked = !checkbox.checked;
    checkbox.value = checkbox.checked;
    toggleSwitchUI(name, checkbox.checked);
}

function toggleSwitchUI(name, isChecked) {
    const switchBg = document.getElementById(name).nextElementSibling;
    const toggle = document.getElementById(name + "-toggle");
    if (isChecked) {
        switchBg.classList.add("active");
        toggle.classList.add("move");
    } else {
        switchBg.classList.remove("active");
        toggle.classList.remove("move");
    }
}

document.getElementById("cancel-btn").addEventListener("click", () => {
    document.getElementById("crud-modal").classList.add("hidden");
});

document.getElementById("crud-form").addEventListener("submit", function(event) {
    const form = event.target;
    form.querySelectorAll("input, select, textarea").forEach(input => {
        if (input.type === "checkbox" || input.type === "switch") {
            if (!input.checked) {
                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = input.name;
                hiddenInput.value = "false";
                form.appendChild(hiddenInput);
            } else {
                input.value = "true";
            }
        }
    });
});
</script>

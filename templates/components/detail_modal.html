<!-- templates/components/detail_modal.html -->
<div id="detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="modal-box w-full max-w-3xl max-h-[85vh] overflow-auto shadow-2xl">
        <button onclick="closeDetailModal()" class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4">✕</button>
        <h2 class="text-2xl font-bold mb-5">Detalhe</h2>

        <!-- Campos de cabeçalho -->
        <div id="detail-cover" class="mb-6">
            <div id="detail-header-fields" class="grid grid-cols-2 gap-3 p-4 bg-base-200 rounded-box">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- Abas -->
        <div id="detail-tabs-container" class="hidden mb-4">
            <div role="tablist" class="tabs tabs-boxed bg-base-200" id="detail-tabs">
                <!-- Criado via JS -->
            </div>
        </div>

        <!-- Conteúdo das abas -->
        <div id="detail-content" class="space-y-4">
            <!-- Criado via JS -->
        </div>

        <div class="modal-action mt-6">
            <button onclick="closeDetailModal()" class="btn btn-ghost">Fechar</button>
        </div>
    </div>
</div>

<script>
    async function openDetailModal(id) {
        const modal = document.getElementById("detail-modal");
        const headerFields = document.getElementById("detail-header-fields");
        const tabsContainer = document.getElementById("detail-tabs-container");
        const tabsList = document.getElementById("detail-tabs");
        const contentContainer = document.getElementById("detail-content");

        const detailSchema = {{ detail_schema | tojson }};

        try {
            const response = await fetch(`/categories/${id}/details`);
            const data = await response.json();

            if (data.error) { alert(data.error); return; }

            headerFields.innerHTML = "";
            tabsList.innerHTML = "";
            contentContainer.innerHTML = "";
            let tabs = {};

            detailSchema.forEach(field => {
                const value = data[field.name];
                if (field.header) {
                    const headerItem = document.createElement("div");
                    headerItem.className = "flex items-center gap-2";
                    headerItem.innerHTML = `<span class="font-semibold text-base-content/60 text-sm">${field.label}:</span><span>${value}</span>`;
                    headerFields.appendChild(headerItem);
                } else if (field.tab) {
                    if (!tabs[field.tab]) tabs[field.tab] = [];
                    tabs[field.tab].push({ field, value });
                }
            });

            const tabNames = Object.keys(tabs);
            tabsContainer.classList.toggle("hidden", tabNames.length === 0);

            tabNames.forEach((tabName, index) => {
                if (tabs[tabName].length === 0) return;

                const tabButton = document.createElement("a");
                tabButton.textContent = tabName;
                tabButton.role = "tab";
                tabButton.className = `tab${index === 0 ? " tab-active" : ""}`;
                tabButton.onclick = () => showTabContent(tabName);
                tabsList.appendChild(tabButton);

                const tabContent = document.createElement("div");
                tabContent.id = `tab-${tabName}`;
                tabContent.className = index === 0 ? "" : "hidden";

                let tabHtml = "";
                tabs[tabName].forEach(({ field, value }) => {
                    if (field.type === "table") {
                        tabHtml += `<div class="overflow-x-auto rounded-box border border-base-300">
                            <table class="table table-sm w-full">
                                <thead><tr class="bg-base-200">`;
                        field.columns.forEach(col => { tabHtml += `<th>${col.label}</th>`; });
                        tabHtml += `</tr></thead><tbody>`;
                        value.forEach(row => {
                            tabHtml += `<tr class="hover">`;
                            field.columns.forEach(col => {
                                if (col.type === "action") {
                                    tabHtml += `<td class="text-center">
                                        <button onclick="handleAction('${row[col.name]}')" class="btn btn-error btn-xs">${col.label}</button>
                                    </td>`;
                                } else {
                                    tabHtml += `<td>${row[col.name]}</td>`;
                                }
                            });
                            tabHtml += `</tr>`;
                        });
                        tabHtml += `</tbody></table></div>`;
                    } else {
                        tabHtml += `<div class="flex items-center gap-2 mb-2">
                            <span class="font-semibold text-base-content/60 text-sm w-36">${field.label}:</span>
                            <span>${value}</span>
                        </div>`;
                    }
                });

                tabContent.innerHTML = tabHtml;
                contentContainer.appendChild(tabContent);
            });

            modal.classList.remove("hidden");
        } catch (error) {
            console.error("Erro ao carregar os detalhes:", error);
            alert("Erro ao carregar detalhes.");
        }
    }

    function showTabContent(tabName) {
        document.querySelectorAll("#detail-content > div").forEach(div => div.classList.add("hidden"));
        document.getElementById(`tab-${tabName}`).classList.remove("hidden");
        document.querySelectorAll("#detail-tabs a").forEach(tab => {
            tab.classList.toggle("tab-active", tab.textContent.trim() === tabName);
        });
    }

    function closeDetailModal() {
        document.getElementById("detail-modal").classList.add("hidden");
    }

    async function handleAction(url) {
        if (!confirm("Tem certeza que deseja realizar esta ação?")) return;
        try {
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" } });
            if (response.ok) { alert("Ação realizada com sucesso!"); location.reload(); }
            else { alert("Erro ao executar ação."); }
        } catch (error) {
            console.error("Erro ao executar ação:", error);
            alert("Erro ao executar ação.");
        }
    }
</script>

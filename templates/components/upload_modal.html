<!-- templates/components/upload_modal.html -->
<div id="upload-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="modal-box w-full max-w-md shadow-2xl">
        <button onclick="closeUploadModal()" class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4">✕</button>
        <h2 class="text-xl font-bold mb-1">{{ upload_schema.label }}</h2>
        <p class="text-sm text-base-content/60 mb-5">{{ upload_schema.description }}</p>

        <form id="upload-form" method="POST" enctype="multipart/form-data" class="space-y-4">
            {% if upload_schema.pre_fields %}
                {% for field in upload_schema.pre_fields %}
                    <div class="form-control">
                        <label for="{{ field.name }}" class="label pb-1">
                            <span class="label-text font-medium">{{ field.label }}</span>
                        </label>
                        {% if field.type == "combobox" %}
                            <select name="{{ field.name }}" id="{{ field.name }}" class="select select-bordered">
                                {% for option in field.options %}
                                    <option value="{{ option.value }}">{{ option.label }}</option>
                                {% endfor %}
                            </select>
                        {% else %}
                            <input type="{{ field.type }}" name="{{ field.name }}" id="{{ field.name }}"
                                   class="input input-bordered" {% if field.required %}required{% endif %}>
                        {% endif %}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="form-control">
                <label for="upload-file" class="label pb-1">
                    <span class="label-text font-medium">Arquivo ({{ upload_schema.file_type | upper }})</span>
                </label>
                <input type="file" name="file" id="upload-file" accept=".{{ upload_schema.file_type }}"
                       class="file-input file-input-bordered w-full">
            </div>

            <div class="modal-action mt-2">
                <button type="button" onclick="uploadFile()" class="btn btn-success gap-2">
                    <i class="fas fa-upload"></i> Enviar
                </button>
                <button type="button" onclick="closeUploadModal()" class="btn btn-ghost">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openUploadModal() {
        document.getElementById("upload-modal").classList.remove("hidden");
    }

    function closeUploadModal() {
        document.getElementById("upload-modal").classList.add("hidden");
    }

    async function uploadFile() {
        const form = document.getElementById("upload-form");
        const formData = new FormData(form);
        try {
            const response = await fetch(`/transactions/upload`, { method: "POST", body: formData });
            if (response.redirected) {
                window.location.href = response.url;
            } else if (response.ok) {
                closeUploadModal();
                window.location.reload();
            } else {
                alert("Erro ao enviar o arquivo. Verifique o formato da planilha.");
            }
        } catch (error) {
            alert("Erro ao enviar o arquivo.");
            console.error(error);
        }
    }
</script>

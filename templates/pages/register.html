{% extends "base_auth.html" %}

{% block title %}Cadastro{% endblock %}
{% block heading %}Criar Conta{% endblock %}

{% block content %}
<form id="register-form" class="space-y-4">
    <div class="form-control">
        <label for="name" class="label pb-1">
            <span class="label-text font-medium">Nome</span>
        </label>
        <input type="text" id="name" name="name" class="input input-bordered" required>
    </div>
    <div class="form-control">
        <label for="email" class="label pb-1">
            <span class="label-text font-medium">Email</span>
        </label>
        <input type="email" id="email" name="email" class="input input-bordered" required>
    </div>
    <div class="form-control">
        <label for="password" class="label pb-1">
            <span class="label-text font-medium">Senha</span>
        </label>
        <input type="password" id="password" name="password" class="input input-bordered" required>
    </div>
    <button type="submit" class="btn btn-success btn-block mt-2">Cadastrar</button>
</form>
{% endblock %}

{% block footer %}
Já tem uma conta? <a href="/login" class="link link-primary font-semibold">Faça login</a>
{% endblock %}

<script>
document.getElementById("register-form").addEventListener("submit", async function(event) {
    event.preventDefault();
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
    });

    if (response.ok) {
        alert("Cadastro realizado com sucesso! Redirecionando para login.");
        window.location.href = "/login";
    } else {
        alert("Erro ao cadastrar. Verifique os dados e tente novamente.");
    }
});
</script>

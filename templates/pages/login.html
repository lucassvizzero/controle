{% extends "base_auth.html" %}

{% block title %}Login{% endblock %}
{% block heading %}
<i class="fas fa-chart-pie text-primary mr-2"></i> Controle Financeiro
{% endblock %}

{% block content %}
{% if error %}
<div role="alert" class="alert alert-error mb-4">
    <i class="fas fa-exclamation-circle"></i>
    <span>{{ error }}</span>
</div>
{% endif %}
<form method="POST" action="/login" class="space-y-4">
    <div class="form-control">
        <label for="username" class="label pb-1">
            <span class="label-text font-medium">Usuário</span>
        </label>
        <input id="username" name="username" class="input input-bordered" required>
    </div>
    <div class="form-control">
        <label for="password" class="label pb-1">
            <span class="label-text font-medium">Senha</span>
        </label>
        <input type="password" id="password" name="password" class="input input-bordered" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block mt-2">Entrar</button>
</form>
{% endblock %}

{% block footer %}
Não tem uma conta? <a href="/register" class="link link-primary font-semibold">Cadastre-se</a>
{% endblock %}

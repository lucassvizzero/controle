<!-- templates/base_auth.html -->
<!DOCTYPE html>
<html lang="pt-br" data-theme="business">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autenticação{% endblock %} - Controle Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 flex items-center justify-center min-h-screen">
    <div class="card w-96 bg-base-100 shadow-2xl">
        <div class="card-body gap-4">
            <h2 class="card-title text-2xl justify-center">{% block heading %}Título{% endblock %}</h2>
            {% block content %}{% endblock %}
            <p class="text-center text-base-content/60 text-sm mt-2">{% block footer %}{% endblock %}</p>
        </div>
    </div>
</body>
</html>
